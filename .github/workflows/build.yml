name: Build APK

on:
  push:
    branches: [main, "dev/**"]
    # Docs-only changes don't need a new APK.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true   # third_party/whisper.cpp

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # The NDK the native build needs isn't on every runner image, and Gradle's own
      # on-demand download sometimes fails mid-way: install it up front, with retries.
      - name: Install NDK
        run: |
          NDK=$(grep -oP 'ndkVersion = "\K[^"]+' app/build.gradle.kts || echo 27.0.12077973)
          for i in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" > /dev/null && break
            echo "NDK install attempt $i failed; retrying"; sleep 10
          done

      # Speaker diarization runtime (sherpa-onnx + onnxruntime), pinned version + checksum.
      - name: Fetch sherpa-onnx libraries
        run: |
          OUT=$(bash scripts/fetch-sherpa-onnx.sh)
          echo "$OUT"
          echo "::notice::$(echo "$OUT" | grep 'sha256')"
          echo "$OUT" | grep '\.so' | while read -r line; do echo "::notice::$line"; done

      # Compiler and resource errors are re-emitted as annotations so they can be read
      # through the checks API (raw job logs aren't reachable from every environment).
      # Tests run on the debug variant; the published APK is the optimised release build
      # (R8, not debuggable), signed with the same committed key.
      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew testDebugUnitTest assembleRelease assembleDebug --console=plain 2>&1 | tee build.log; then
            grep -E '^e: |error:|ERROR:|AAPT|What went wrong|FAILED|Test.*>|Missing class|R8:' -A3 build.log | head -60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      # The transcription engine is native: fail loudly if it didn't make it into the APK.
      - name: Check native libraries
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -E '\.so$' | while read -r size _ _ name; do echo "::notice::$name $((size/1024)) KB"; done
          for lib in libcallnotes_whisper.so libsherpa-onnx-jni.so libonnxruntime.so libsqlcipher.so; do
            unzip -l "$APK" | grep -q "lib/arm64-v8a/$lib" || { echo "::error::$lib missing from APK"; exit 1; }
          done
          echo "::notice::APK $(( $(stat -c%s "$APK") / 1024 / 1024 )) MB"

      - name: Name the APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "TAG=v${VERSION}-build.${{ github.run_number }}" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "call-notes-${VERSION}-build.${{ github.run_number }}.apk"
          # Same code as a debug build, for a Play Protect comparison (temporary).
          cp app/build/outputs/apk/debug/app-debug.apk "call-notes-${VERSION}-build.${{ github.run_number }}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: call-notes-apk
          path: call-notes-*.apk

      # A release per build gives a plain download page you can open on the phone.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" call-notes-*.apk \
            --prerelease \
            --title "$TAG" \
            --notes "Build from ${GITHUB_SHA::7}. Install the APK without '-debug' on the phone. The '-debug' APK is the same code as a debug build, only for comparing Play Protect results."
