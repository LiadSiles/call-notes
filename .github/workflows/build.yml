name: Build APK

on:
  push:
    branches: [main]
    # Docs-only changes don't need a new APK.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "TAG=v${VERSION}-build.${{ github.run_number }}" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "call-notes-${VERSION}-build.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: call-notes-apk
          path: call-notes-*.apk

      # A release per build gives a plain download page you can open on the phone.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" call-notes-*.apk \
            --prerelease \
            --title "$TAG" \
            --notes "Debug build from ${GITHUB_SHA::7}. Download the APK on the phone and install it."
